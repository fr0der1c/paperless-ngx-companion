[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-ngx-companion"
version = "0.1.0"
description = "Webhook-driven multimodal LLM OCR companion for Paperless-ngx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.24.0.post1",
  "httpx==0.27.2",
  "pdf2image==1.17.0",
  "pillow==10.3.0",
  "python-multipart>=0.0.28",
]

[tool.setuptools]
py-modules = ["app", "local_ocr_test"]

